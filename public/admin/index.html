<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Note: The stylesheet path is relative to the admin folder -->
    <link rel="stylesheet" href="../style.css">
    <style>
        /* Additional styles for admin page */
        body {
            background-color: #282828;
        }
        #admin-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: #1e1e1e;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #1DB954;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #1ed760;
        }
        .btn-delete {
            background-color: #e53e3e;
        }
        .btn-delete:hover {
            background-color: #fc8181;
        }
        #login-section, #dashboard-section {
            padding: 1rem;
        }
         .date-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="admin-container">
        <h1>Admin Dashboard</h1>

        <!-- Login Section -->
        <div id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
        </div>

        <!-- Dashboard Section (hidden by default) -->
        <div id="dashboard-section" style="display: none;">
            <h2>Add New Date</h2>
            <form id="add-date-form">
                <div class="form-group">
                    <label for="event_date">Date</label>
                    <input type="date" id="event_date" required>
                </div>
                <div class="form-group">
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" placeholder="e.g., The Grand Arena" required>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="e.g., New York, NY" required>
                </div>
                <div class="form-group">
                    <label for="ticket_url">Ticket URL</label>
                    <input type="url" id="ticket_url" placeholder="https://tickets.example.com" required>
                </div>
                <button type="submit" class="btn">Add Date</button>
            </form>

            <hr style="margin: 2rem 0; border-color: #444;">

            <h2>Existing Dates</h2>
            <div id="existing-dates-list">
                <!-- Dates will be loaded here -->
            </div>
        </div>
    </div>
    
    <!-- ALL JAVASCRIPT IS NOW EMBEDDED IN THE HTML -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Admin panel script loaded successfully.");

            const loginSection = document.getElementById('login-section');
            const dashboardSection = document.getElementById('dashboard-section');
            const loginForm = document.getElementById('login-form');
            const addDateForm = document.getElementById('add-date-form');
            const existingDatesList = document.getElementById('existing-dates-list');

            let authToken = null;

            // --- MODAL LOGIC ---
            function setupModal() {
                const modalHTML = `
                    <div id="custom-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
                        <div id="custom-modal-box" style="background: #2c2c2c; padding: 25px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 90%;">
                            <h3 id="modal-title" style="margin-top: 0; color: #fff;"></h3>
                            <p id="modal-message" style="color: #e0e0e0;"></p>
                            <div id="modal-buttons"></div>
                        </div>
                    </div>`;
                document.body.insertAdjacentHTML('beforeend', modalHTML);
            }

            function showModal(title, message, buttons) {
                const overlay = document.getElementById('custom-modal-overlay');
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').textContent = message;
                const buttonsContainer = document.getElementById('modal-buttons');
                buttonsContainer.innerHTML = '';

                if (buttons) {
                    buttons.forEach(btnInfo => {
                        const button = document.createElement('button');
                        button.textContent = btnInfo.text;
                        button.className = btnInfo.class || 'btn';
                        button.style.margin = '0 10px';
                        button.onclick = () => {
                            overlay.style.display = 'none';
                            if (btnInfo.onClick) btnInfo.onClick();
                        };
                        buttonsContainer.appendChild(button);
                    });
                } else {
                    const okButton = document.createElement('button');
                    okButton.textContent = 'OK';
                    okButton.className = 'btn';
                    okButton.onclick = () => overlay.style.display = 'none';
                    buttonsContainer.appendChild(okButton);
                }
                overlay.style.display = 'flex';
            }
            
            setupModal();

            // --- LOGIN LOGIC ---
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = document.getElementById('password').value;
                if (!password) {
                    showModal("Login Error", "Please enter a password.");
                    return;
                }
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: password })
                    });
                    if (response.ok) {
                        authToken = password;
                        loginSection.style.display = 'none';
                        dashboardSection.style.display = 'block';
                        loadExistingDates();
                    } else {
                        const errorData = await response.json();
                        showModal("Login Failed", errorData.error || "Please try again.");
                    }
                } catch (error) {
                    console.error("Login API call failed:", error);
                    showModal("Login Error", "An API error occurred. Is the Vercel dev server running?");
                }
            });

            // --- LOAD, ADD, DELETE LOGIC ---
            async function loadExistingDates() {
                existingDatesList.innerHTML = '<p>Loading dates...</p>';
                try {
                    const response = await fetch('/api/get_dates');
                    if (!response.ok) throw new Error(`Server error: ${response.status}`);
                    const dates = await response.json();
                    existingDatesList.innerHTML = '';
                    if (dates.length === 0) {
                        existingDatesList.innerHTML = '<p>No dates found.</p>';
                        return;
                    }
                    dates.sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
                    dates.forEach(date => {
                        const div = document.createElement('div');
                        div.className = 'date-entry';
                        const eventDate = new Date(date.event_date + 'T00:00:00Z');
                        const formattedDate = eventDate.toLocaleDateString('en-US', { timeZone: 'UTC', year: 'numeric', month: '2-digit', day: '2-digit' });
                        div.innerHTML = `<span>${formattedDate} - ${date.venue}, ${date.city}</span><button class="btn btn-delete" data-id="${date.id}">Delete</button>`;
                        existingDatesList.appendChild(div);
                    });
                } catch (error) {
                    showModal("Error", `Could not load tour dates: ${error.message}`);
                }
            }

            addDateForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                try {
                    const response = await fetch('/api/manage_dates', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                        body: JSON.stringify({
                            event_date: document.getElementById('event_date').value,
                            venue: document.getElementById('venue').value,
                            city: document.getElementById('city').value,
                            ticket_url: document.getElementById('ticket_url').value,
                        })
                    });
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'An unknown error occurred' }));
                        throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                    }
                    showModal("Success!", "Date added successfully!");
                    addDateForm.reset();
                    loadExistingDates();
                } catch (error) {
                    showModal("Error", `Failed to add date: ${error.message}`);
                }
            });

            existingDatesList.addEventListener('click', (e) => {
                if (e.target.classList.contains('btn-delete')) {
                    const dateId = e.target.dataset.id;
                    showModal("Confirm Deletion", "Are you sure you want to delete this date?", [
                        { text: "Cancel", class: "btn" },
                        { text: "Delete", class: "btn btn-delete", onClick: () => performDelete(dateId) }
                    ]);
                }
            });

            async function performDelete(dateId) {
                try {
                    const response = await fetch('/api/manage_dates', {
                        method: 'DELETE',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                        body: JSON.stringify({ id: parseInt(dateId) })
                    });
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({ error: 'Failed to delete' }));
                        throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                    }
                    showModal("Success!", "Date deleted successfully!");
                    loadExistingDates();
                } catch (error) {
                    showModal("Error", `Failed to delete date: ${error.message}`);
                }
            }
        });
    </script>
</body>
</html>
