<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../style.css"> <!-- Reusing the main stylesheet -->
    <style>
        /* Additional styles for admin page */
        body {
            background-color: #282828;
        }
        #admin-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
            background: #1e1e1e;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #1DB954;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #1ed760;
        }
        .btn-delete {
            background-color: #e53e3e;
        }
        .btn-delete:hover {
            background-color: #fc8181;
        }
        #login-section, #dashboard-section {
            padding: 1rem;
        }
         .date-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            background: #2a2a2a;
            border-radius: 4px;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="admin-container">
        <h1>Admin Dashboard</h1>

        <!-- Login Section -->
        <div id="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p id="login-error" style="color: red;"></p>
        </div>

        <!-- Dashboard Section (hidden by default) -->
        <div id="dashboard-section" style="display: none;">
            <h2>Add New Date</h2>
            <form id="add-date-form">
                <div class="form-group">
                    <label for="event_date">Date</label>
                    <input type="date" id="event_date" required>
                </div>
                <div class="form-group">
                    <label for="venue">Venue</label>
                    <input type="text" id="venue" placeholder="e.g., The Grand Arena" required>
                </div>
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="e.g., New York, NY" required>
                </div>
                <div class="form-group">
                    <label for="ticket_url">Ticket URL</label>
                    <input type="url" id="ticket_url" placeholder="https://tickets.example.com" required>
                </div>
                <button type="submit" class="btn">Add Date</button>
            </form>
            <p id="form-message" style="color: lightgreen;"></p>

            <hr style="margin: 2rem 0; border-color: #444;">

            <h2>Existing Dates</h2>
            <div id="existing-dates-list">
                <!-- Dates will be loaded here -->
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
